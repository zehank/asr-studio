<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · 转文字 / 翻译 / 总结</title>
<style>
  :root{
    --bg:#0c0d10; --card:#15171c; --line:#242833; --dim:#8b93a7; --fg:#e9ecf2;
    --accent:#7c5cff; --accent2:#22d3a6; --err:#ff9db2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:40px 22px 80px}
  header.top{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px}
  .drop{margin-top:24px;border:1.5px dashed var(--line);border-radius:16px;background:var(--card);
    padding:32px 22px;text-align:center;cursor:pointer;transition:.18s}
  .drop:hover,.drop.over{border-color:var(--accent);background:#181a21}
  .drop strong{display:block;font-size:16px;margin-bottom:6px}
  .drop span{color:var(--dim);font-size:13px}
  .opts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
  .opt{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;
    padding:10px 14px;background:var(--card);cursor:pointer;user-select:none;font-size:14px}
  .opt.fixed{opacity:.72;cursor:default}
  .opt input{appearance:none;width:17px;height:17px;border:1.5px solid #3a4050;border-radius:5px;margin:0;
    display:grid;place-items:center;cursor:pointer}
  .opt input:checked{background:var(--accent);border-color:var(--accent)}
  .opt input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;
    border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
  select{background:#101218;color:var(--fg);border:1px solid var(--line);border-radius:9px;
    padding:6px 8px;font-size:14px;font-family:inherit}
  .cfgrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0;align-items:center}
  .cfgrow input{background:#101218;color:var(--fg);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:13px;font-family:inherit;min-width:230px}
  .cfgrow button{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#1d2029;
    color:var(--fg);font-size:13px}
  .cfgrow .hint{color:var(--dim);font-size:12px}
  .cfgrow .ok{color:var(--accent2);font-size:12px}
  .actions{display:flex;gap:10px;margin-top:18px}
  button{font-family:inherit;cursor:pointer}
  #run{flex:1;padding:13px;border:0;border-radius:12px;font-size:15px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--accent),#5b7cff)}
  #run:disabled{opacity:.4;cursor:not-allowed}
  #stopAll{padding:13px 18px;border:1px solid #5a2233;border-radius:12px;font-size:14px;
    font-weight:600;color:var(--err);background:#1d1218}
  .item{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
  .item .hd{display:flex;align-items:center;gap:10px;padding:12px 15px}
  .item .nm{font-weight:600;font-size:14px;word-break:break-all}
  .item .sz{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .chip{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);
    border-radius:99px;padding:2px 10px;white-space:nowrap}
  .chip.run{color:#b6a6ff;border-color:#3a3060}
  .chip.done{color:var(--accent2);border-color:#1f4a3e}
  .chip.err{color:var(--err);border-color:#5a2233}
  .mini{height:2px;background:#1e222c}
  .mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s}
  .msg{padding:8px 15px;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .x{background:#1d2029;border:1px solid var(--line);color:var(--fg);border-radius:8px;
    padding:4px 10px;font-size:12px}
  .out{padding:0 15px 15px}
  .blk{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .blk .t{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .blk .t b{font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--dim);font-weight:600}
  .blk .t button,.blk .t a{margin-left:auto;font-size:12px;color:var(--dim);background:none;border:0;
    padding:0;text-decoration:none;border-bottom:1px dotted #3a4155}
  .blk .t button+a{margin-left:12px}
  .txt{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.72;max-height:320px;overflow:auto}
  .warnline{margin-top:8px;color:#f0c877;font-size:12.5px}
  footer{margin-top:30px;color:#5c6478;font-size:12px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Studio</h1>
    <div class="sub">转文字 · 翻译 · 总结 — 本地转写，最多 2 个文件同时跑</div>
  </header>

  <div class="drop" id="drop">
    <strong>把文件拖进来（可以一次拖多个）</strong>
    <span>或者点这里选 · m4a mp3 wav flac mp4 mov 都行</span>
  </div>
  <input type="file" id="picker" multiple accept="audio/*,video/*,.m4a,.mp3,.wav,.flac,.mp4,.mov,.aac" hidden>

  <div class="opts">
    <label class="opt fixed"><input type="checkbox" checked disabled>转文字</label>
    <label class="opt"><input type="checkbox" id="optTr">翻译</label>
    <label class="opt"><input type="checkbox" id="optSum">总结</label>
    <label class="opt">识别语言
      <select id="lang">
        <option value="auto">自动（中英混说）</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>
    <label class="opt" id="dirBox" style="display:none">翻译方向
      <select id="dir">
        <option value="auto">自动（中→英 / 英→中）</option>
        <option value="en">→ English</option>
        <option value="zh-CN">→ 中文</option>
      </select>
    </label>
  </div>

  <div class="cfgrow">
    <label class="opt" style="padding:8px 12px">总结用
      <select id="prov">
        <option value="deepseek">DeepSeek API</option>
        <option value="gemini">Gemini（免费额度）</option>
        <option value="ollama">本地 Ollama</option>
        <option value="pollinations">免费公共接口（慢）</option>
      </select>
    </label>
    <input id="key" type="password" placeholder="粘贴 API key（ollama/免费接口不需要）" autocomplete="off">
    <input id="model" placeholder="模型（可留空）" style="min-width:150px">
    <button id="saveCfg">保存</button>
    <span class="hint" id="cfgHint"></span>
  </div>

  <div class="actions">
    <button id="run" disabled>开始处理</button>
    <button id="stopAll" hidden>全部取消</button>
  </div>

  <div id="list"></div>

  <footer>
    转文字：whisper.cpp 本地大模型（Metal GPU，同时最多 2 个进程）<br>
    翻译：Google 翻译免费接口 · 总结：Pollinations 免费模型（每 45 秒 1 次，自动排队）<br>
    结果存在 <code>studio/output/</code>，每个文件一个文件夹
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const MAX_PARALLEL = 2;
let jobs = [];          // {file,id,status,pct,msg,token,ctrl,result,el}
let running = 0;
let queue = [];

$('drop').onclick = () => $('picker').click();
$('picker').onchange = e => addFiles([...e.target.files]);
['dragenter','dragover'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
$('optTr').onchange = () => $('dirBox').style.display = $('optTr').checked ? 'flex' : 'none';

async function loadCfg() {
  try {
    const c = await (await fetch('/api/config')).json();
    $('prov').value = c.provider;
    $('model').value = c.model || '';
    $('cfgHint').textContent = c.hasKey ? '已保存 key' + c.keyHint : (c.provider === 'pollinations' ? '免费接口：每 45 秒 1 次' : '还没填 key');
    $('cfgHint').className = c.hasKey ? 'ok' : 'hint';
  } catch {}
}
$('saveCfg').onclick = async () => {
  $('cfgHint').textContent = '保存中…';
  try {
    const r = await (await fetch('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: $('prov').value, model: $('model').value, key: $('key').value })
    })).json();
    $('key').value = '';
    $('cfgHint').textContent = r.ok ? '已保存' + (r.hasKey ? '（key 已存）' : '') : '保存失败';
    $('cfgHint').className = r.ok ? 'ok' : 'hint';
  } catch { $('cfgHint').textContent = '保存失败'; }
};
$('prov').onchange = () => {
  $('key').placeholder = $('prov').value === 'pollinations' ? '免费接口不需要 key' : '粘贴 API key';
};
loadCfg();

const fmt = n => n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : (n/1024).toFixed(0) + ' KB';

function addFiles(files) {
  files.forEach(f => {
    if (jobs.some(j => j.file.name === f.name && j.file.size === f.size)) return;
    jobs.push({ file: f, id: 'j' + Math.random().toString(36).slice(2, 8),
      status: 'wait', pct: 0, msg: '排队中', token: null, ctrl: null, result: null });
  });
  render(); $('run').disabled = jobs.length === 0;
}

function render() {
  const list = $('list');
  list.innerHTML = '';
  jobs.forEach(job => {
    const el = document.createElement('article');
    el.className = 'item';
    el.innerHTML = `
      <div class="hd">
        <span class="nm">${esc(job.file.name)}</span>
        <span class="sz">${fmt(job.file.size)}</span>
        <span class="chip ${job.status === 'run' ? 'run' : job.status === 'done' ? 'done' : job.status === 'err' ? 'err' : ''}">${label(job)}</span>
        ${job.status === 'run' ? '<button class="x" data-cancel="' + job.id + '">取消</button>' : ''}
      </div>
      <div class="mini"><i style="width:${job.pct}%"></i></div>
      <div class="msg">${esc(job.msg)}</div>
      <div class="out">${job.result ? outHtml(job) : ''}</div>`;
    list.appendChild(el);
  });
  list.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelJob(b.dataset.cancel));
  list.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.closest('.blk').querySelector('.txt').textContent);
      b.textContent = '已复制'; } catch { b.textContent = '复制失败'; }
    setTimeout(() => b.textContent = '复制', 1200);
  });
  list.querySelectorAll('[data-open]').forEach(b => b.onclick = () =>
    fetch('/api/open?job=' + encodeURIComponent(b.dataset.open), { method: 'POST' }).catch(() => {}));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = j => ({ wait: '排队中', run: Math.round(j.pct) + '%', done: '完成', err: '失败', cancel: '已取消' })[j.status];

function outHtml(job) {
  const r = job.result;
  let h = '';
  if (r.text) h += `<div class="blk"><div class="t"><b>文件</b>
      <a href="${r.files.text}" download>下 transcript.txt</a>
      <a href="${r.files.srt}" download>下 .srt</a>
      <button data-open="${esc(r.job)}">打开文件夹</button></div></div>`;
  if (r.translation) h += `<div class="blk"><div class="t"><b>翻译</b><button data-copy>复制</button></div>
      <div class="txt">${esc(r.translation)}</div></div>`;
  if (r.summary) h += `<div class="blk"><div class="t"><b>总结</b><button data-copy>复制</button></div>
      <div class="txt">${esc(r.summary)}</div></div>`;
  if (r.warning) h += `<div class="warnline">⚠ ${esc(r.warning)}</div>`;
  return h;
}

function next() {
  while (running < MAX_PARALLEL && queue.length) runJob(queue.shift());
}

async function runJob(job) {
  running++;
  job.status = 'run'; job.msg = '开始…'; job.pct = 1;
  job.ctrl = new AbortController();
  render();
  const q = new URLSearchParams({
    translate: $('optTr').checked ? 1 : 0,
    summary: $('optSum').checked ? 1 : 0,
    lang: $('lang').value, dir: $('dir').value,
  });
  try {
    const res = await fetch('/api/run?' + q, {
      method: 'POST', body: job.file, signal: job.ctrl.signal,
      headers: { 'X-Filename': encodeURIComponent(job.file.name) }
    });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.type === 'start') job.token = ev.token;
        else if (ev.type === 'cancelled') throw Object.assign(new Error('已取消'), { cancelled: true });
        else if (ev.type === 'progress') { job.msg = ev.msg; job.pct = ev.pct; paintJob(job); }
        else if (ev.type === 'done') {
          job.status = 'done'; job.pct = 100; job.result = ev; job.msg = '已保存到 studio/output/' + ev.job;
          render();
        } else if (ev.type === 'error') throw new Error(ev.error);
      }
    }
    if (job.status !== 'done') { job.status = 'err'; job.msg = '没有拿到结果'; }
  } catch (e) {
    if (e.cancelled || e.name === 'AbortError') { job.status = 'cancel'; job.msg = '已取消'; }
    else { job.status = 'err'; job.msg = String(e.message); }
    render();
  } finally {
    running--; next();
    if (running === 0 && !queue.length) {
      $('run').disabled = false; $('run').textContent = '开始处理'; $('stopAll').hidden = true;
    }
  }
}

function paintJob(job) {
  const els = $('list').querySelectorAll('.item');
  const idx = jobs.indexOf(job);
  if (!els[idx]) return;
  const chip = els[idx].querySelector('.chip');
  const bar = els[idx].querySelector('.mini i');
  const msg = els[idx].querySelector('.msg');
  if (chip) { chip.textContent = label(job); chip.className = 'chip run'; }
  if (bar) bar.style.width = job.pct + '%';
  if (msg) msg.textContent = job.msg;
}

function cancelJob(id) {
  const job = jobs.find(j => j.id === id);
  if (!job) return;
  job.msg = '正在取消…'; paintJob(job);
  if (job.token) fetch('/api/cancel?token=' + encodeURIComponent(job.token), { method: 'POST' }).catch(() => {});
  if (job.ctrl) job.ctrl.abort();
}

$('stopAll').onclick = () => jobs.filter(j => j.status === 'run').forEach(j => cancelJob(j.id));

$('run').onclick = () => {
  const pend = jobs.filter(j => j.status === 'wait' || j.status === 'err' || j.status === 'cancel');
  pend.forEach(j => { j.status = 'wait'; j.pct = 0; j.msg = '排队中'; j.result = null; });
  queue = pend.slice();
  rendersafe();
  $('run').disabled = true; $('run').textContent = '处理中…'; $('stopAll').hidden = false;
  next();
};

function rendersafe() { render(); if (!queue.length && running === 0) { $('run').disabled = false; $('run').textContent = '开始处理'; } }
</script>
</body>
</html>
